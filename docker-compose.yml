
services:
  backend:
    build:
      context: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      DB_HOST: host.docker.internal
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
